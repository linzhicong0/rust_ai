# Docker Compose configuration for AI Framework (REQ-16.2)
# Provides the API server with common dependencies.

services:
  # AI Framework API Server
  ai-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AI_SERVER_PORT:-8080}:8080"
    environment:
      - AI_SERVER__HOST=0.0.0.0
      - AI_SERVER__PORT=8080
      - AI_LOG_LEVEL=${AI_LOG_LEVEL:-info}
      - RUST_LOG=${RUST_LOG:-ai=info}
      - AI_PROVIDER__OPENAI__API_KEY=${AI_PROVIDER__OPENAI__API_KEY:-}
      - AI_PROVIDER__ANTHROPIC__API_KEY=${AI_PROVIDER__ANTHROPIC__API_KEY:-}
      - AI_CACHE__REDIS__URL=redis://redis:6379
      - AI_MEMORY__STORE_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Redis for caching, task queues, and shared state
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
